[build-system]
requires = ['setuptools>=69', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'altegio-bot'
version = '0.1.0'
description = 'FastAPI webhook + workers for Altegio -> WhatsApp'
requires-python = '>=3.12'
dependencies = [
  'alembic>=1.13',
  'asyncpg>=0.29',
  'fastapi>=0.115',
  'httpx>=0.27',
  'pydantic-settings>=2.6',
  'pydantic>=2.9',
  'python-dotenv>=1.0',
  'python-multipart>=0.0.9',
  'sqlalchemy[asyncio]>=2.0',
  'uvicorn[standard]>=0.30',
]

[dependency-groups]
dev = [
  'pytest-asyncio>=0.24',
  'pytest>=8.3',
  'respx>=0.21',
  "ruff>=0.15.4",
  # A real browser for the §43 operator UI acceptance tests. The Ops pages are the
  # product of that phase, and API calls cannot show that a click reaches the right
  # handler, that a value typed into a field arrives, that polling repaints or that
  # navigation lands — all of which are the operator path itself.
  #
  # Chromium is installed in CI by `playwright install --with-deps chromium`, and the
  # browser suite FAILS rather than skips when it is missing: see
  # ALTEGIO_REQUIRE_BROWSER_TESTS in the required gate.
  'playwright>=1.47',
  # The history-rewriting engine behind
  # `altegio_bot.scripts.clean_git_authorship`. A dev dependency rather than a
  # runtime one: the application never rewrites history, and only the tool and
  # its required regressions need it. Pinned into the lock so `uv sync --frozen`
  # provides it identically on a laptop and on every required CI runner —
  # the suite must not quietly skip because a Homebrew install happened to be
  # on one machine's PATH and not on the runner's.
  'git-filter-repo>=2.47',
]

[tool.setuptools]
package-dir = { '' = 'src' }
include-package-data = true

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
# `--strict-markers` turns a typo such as `legacy_altegia` into a collection
# error instead of a silently unmarked test that stays in the required suite
# while its author believes it was quarantined.
#
# `addopts` deliberately does NOT carry `-m "not legacy_altegio"`. A plain
# `uv run pytest` must stay the full project suite, and a new test must land in
# the required tier unless somebody marks it by hand. The negative filter lives
# only in the required CI invocation; see docs/ops/test_suite_tiers.md.
addopts = '-q --strict-markers'
testpaths = ['src/altegio_bot/tests']
markers = [
  'legacy_altegio: only tests of Altegio-only functionality withdrawn from the required PR gate. Never for EasyWeek, migration/handover, provider isolation, security or shared-runtime behaviour, which stay required. Applied per module as `pytestmark`, never by path or filename heuristics. Runs nightly and on demand via the Legacy Altegio Tests workflow.',
]

[tool.ruff]

line-length = 120

exclude = [
    ".git",
    ".venv",
    "venv",
    "alembic",
    "__pycache__",
    "altegio_bot.egg-info"
]

[tool.ruff.lint.per-file-ignores]
# В файлах __init__.py разрешаем импортировать модули.
"__init__.py" = ["F401"]

[tool.ruff.lint]
# Включаем базовые правила:
# E - ошибки стиля (pycodestyle)
# F - логические ошибки (Pyflakes), например, неиспользуемые переменные
# I - сортировка импортов (isort)
select = ["E", "F", "I"]

# Если какое-то правило бесит, его можно отключить тут:
ignore = []
