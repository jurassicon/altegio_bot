name: CI / Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Runs targeting refs/heads/main (push or manual dispatch) share ONE group so a
  # second main deploy can never start mid-flight and is never cancelled by the
  # next push — it queues behind the running deploy instead. Everything else
  # (pull requests, dispatches on other refs) keeps its own per-ref group and can
  # still be cancelled by a newer commit in the same PR.
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-production-deploy', github.workflow) || format('{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 1. Проверка стиля кода с помощью Ruff — только на pull request. push в main
  # и workflow_dispatch деплоят уже проверенный required-checks коммит и не
  # должны повторно занимать runner под линт.
  lint:
    name: Lint with Ruff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Check syntax and rules (Ruff check)
        run: uvx ruff check .

      - name: Check formatting (Ruff format)
        run: uvx ruff format --check .

  alembic:
    name: Check Alembic migrations
    if: github.event_name == 'pull_request' && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: altegio_bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d altegio_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/altegio_bot_test
      ALTEGIO_WEBHOOK_SECRET: test-secret
      WHATSAPP_PROVIDER: dummy
      ALLOW_REAL_SEND: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and deps
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: Check exactly one Alembic head
        run: |
          HEADS_COUNT="$(uv run alembic heads | grep -c '(head)' || true)"
          if [ "$HEADS_COUNT" -ne 1 ]; then
            echo "ERROR: Alembic must have exactly one head, got $HEADS_COUNT"
            uv run alembic heads
            exit 1
          fi
          echo "OK: single head confirmed"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Verify current revision
        run: uv run alembic current

      # NOTE: `alembic upgrade head --sql` (offline SQL generation) is intentionally
      # excluded. Migration 2c24d34e45e2 uses sa.inspect() on an offline
      # MockConnection and causes an error in offline mode. This will be fixed in a
      # separate PR targeting that migration.

  tests:
    name: Run Tests
    if: github.event_name == 'pull_request' && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altegio_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d altegio_bot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/altegio_bot_test
      ALTEGIO_WEBHOOK_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and deps
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: Wait for Postgres
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import asyncpg

          def to_asyncpg_dsn(sqlalchemy_dsn: str) -> str:
              dsn = sqlalchemy_dsn.strip().strip('"').strip("'")
              if dsn.startswith('postgresql+asyncpg://'):
                  return 'postgresql://' + dsn.split('://', 1)[1]
              return dsn

          async def main() -> None:
              raw = os.environ['DATABASE_URL']
              dsn = to_asyncpg_dsn(raw)
              for _ in range(120):
                  try:
                      conn = await asyncpg.connect(dsn, timeout=3)
                      await conn.close()
                      print('Postgres is ready')
                      return
                  except:
                      await asyncio.sleep(1)
              raise SystemExit('Postgres did not become ready')
          asyncio.run(main())
          PY

      # Runs first and as its own step so it can never degrade into a green
      # skip: ALTEGIO_REQUIRE_MIGTEST=1 turns "cannot create the disposable
      # database" into a failure. It proves an environment that applied only the
      # early base revision still gets the raw-body columns.
      - name: Run required EasyWeek migration compatibility test
        env:
          ALTEGIO_REQUIRE_MIGTEST: "1"
        run: uv run pytest -q src/altegio_bot/tests/test_easyweek_migration_integration.py

      # Webhook secrets travel in the query string, so the safe-logging selector
      # is a security control, not a style preference. It is verified against a
      # real, digest-pinned Nginx because the bypass it closes depends on Nginx's
      # own URI normalisation. ALTEGIO_REQUIRE_NGINX_LOGTEST=1 turns "Docker or
      # the image is unavailable" into a failure, so this step can never degrade
      # into a green skip. It has no continue-on-error and no `if:` guard.
      - name: Run required Nginx webhook log security tests
        env:
          ALTEGIO_REQUIRE_NGINX_LOGTEST: "1"
        run: uv run pytest -q src/altegio_bot/tests/test_nginx_webhook_logging_integration.py

      # Both Docker-dependent suites above already ran under their own mandatory
      # gates; re-running them here would only duplicate container work.
      - name: Run tests
        run: |
          uv run pytest -q \
            --ignore=src/altegio_bot/tests/test_easyweek_migration_integration.py \
            --ignore=src/altegio_bot/tests/test_nginx_webhook_logging_integration.py

  deploy:
    name: Deploy to Server
    # No `needs: [tests, alembic]` — branch protection already required those
    # checks to pass before this commit could be merged into main, and this job
    # only ever runs for main (push or manual dispatch), never for pull
    # requests. Re-running them here would just duplicate CI that already ran.
    # SECURITY NOTE: this shortcut is only safe as long as the `main` branch
    # ruleset keeps "lint" / "alembic" / "tests" as required PR checks and
    # blocks direct pushes to main.
    if: >-
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_SHA
          # Bootstrap only. The rollout itself lives in scripts/deploy_pr3.sh:
          # `script:` is evaluated as ONE template expression capped at 21000
          # characters, and the full PR-3 program is far past that — inlining it
          # made the whole workflow file invalid, so no job could start at all.
          # Fetch the exact commit FIRST so the script that runs is the one this
          # deploy is shipping, then hand over.
          script: |
            set -Eeuo pipefail
            cd /opt/altegio_bot
            git fetch --prune origin
            git reset --hard "$DEPLOY_SHA"
            exec bash scripts/deploy_pr3.sh

      - name: Wait for service stabilization
        run: sleep 60

      - name: Verify deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            cd /opt/altegio_bot

            COMPOSE="docker compose -p altegio_bot -f docker-compose.yml -f docker-compose.chatwoot-internal.yml"

            echo "🔎 Verifying deployed revision..."
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            test "$DEPLOYED_SHA" = "${{ github.sha }}" || {
              echo "❌ Post-deploy revision mismatch: expected ${{ github.sha }}, found $DEPLOYED_SHA"
              exit 1
            }
            echo "✅ Server is on the expected commit: $DEPLOYED_SHA"

            echo "🔎 Verifying critical containers..."
            CRITICAL_SERVICES="
            postgres
            redis
            altegio-api
            altegio-inbox-worker
            altegio-outbox-worker
            altegio-whatsapp-inbox-worker
            altegio-meta-guard-worker
            altegio-campaign-worker
            altegio-followup-worker
            "

            for SERVICE in $CRITICAL_SERVICES; do
              CONTAINER=$(docker ps -a \
                --filter "label=com.docker.compose.project=altegio_bot" \
                --filter "label=com.docker.compose.service=${SERVICE}" \
                --format "{{.Names}}" \
                | head -n 1)

              if [ -z "$CONTAINER" ]; then
                echo "❌ ${SERVICE}: no container found"
                exit 1
              fi

              STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER")
              HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER")
              RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CONTAINER")

              echo "service=${SERVICE} container=${CONTAINER} state=${STATE} health=${HEALTH} restarts=${RESTARTS}"

              if [ "$STATE" != "running" ]; then
                echo "❌ ${SERVICE}: container state is '${STATE}', expected 'running' (possible crash/restart loop)"
                exit 1
              fi
              if [ "$HEALTH" = "unhealthy" ]; then
                echo "❌ ${SERVICE}: health status is 'unhealthy'"
                exit 1
              fi
            done
            echo "✅ All critical containers are running"

            echo "🔎 Verifying PostgreSQL..."
            PG_CONTAINER=$(docker ps \
              --filter "label=com.docker.compose.project=altegio_bot" \
              --filter "label=com.docker.compose.service=postgres" \
              --format "{{.Names}}" \
              | head -n 1)

            if [ -z "$PG_CONTAINER" ]; then
              echo "❌ postgres: no running container found"
              exit 1
            fi

            PG_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$PG_CONTAINER")
            if [ "$PG_HEALTH" != "healthy" ]; then
              echo "❌ postgres: Docker health status is '${PG_HEALTH}', expected 'healthy'"
              exit 1
            fi

            $COMPOSE exec -T postgres sh -lc '
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"
            ' >/dev/null
            echo "✅ PostgreSQL is healthy and answered SELECT 1"

            echo "🔎 Verifying Redis..."
            REDIS_PING="$($COMPOSE exec -T redis redis-cli ping | tr -d '\r')"
            if [ "$REDIS_PING" != "PONG" ]; then
              echo "❌ redis-cli ping returned '${REDIS_PING}', expected 'PONG'"
              exit 1
            fi
            echo "✅ Redis responded PONG"

            echo "🔎 Verifying Alembic revision (DB heads == code heads)..."
            $COMPOSE exec -T altegio-api /app/.venv/bin/python - <<'PY'
            import asyncio
            import sys

            from sqlalchemy import text

            from alembic.config import Config
            from alembic.runtime.migration import MigrationContext
            from alembic.script import ScriptDirectory

            from altegio_bot.db import engine


            def _current_heads(sync_connection):
                return MigrationContext.configure(sync_connection).get_current_heads()


            async def main() -> int:
                config = Config("/app/alembic.ini")
                script = ScriptDirectory.from_config(config)
                code_heads = set(script.get_heads())

                async with engine.connect() as connection:
                    (await connection.execute(text("SELECT 1"))).scalar_one()
                    db_heads = set(await connection.run_sync(_current_heads))

                await engine.dispose()

                print(f"code_heads={sorted(code_heads)}")
                print(f"db_heads={sorted(db_heads)}")

                if not code_heads:
                    print("FAIL: code heads are empty")
                    return 1
                if not db_heads:
                    print("FAIL: database heads are empty")
                    return 1
                if code_heads != db_heads:
                    print("FAIL: database heads do not match code heads")
                    return 1

                print("OK: database heads match code heads")
                return 0


            sys.exit(asyncio.run(main()))
            PY
            echo "✅ Alembic revision verified"

            echo "🔎 Verifying internal API health endpoint..."
            INTERNAL_HEALTH_BODY="$(mktemp)"
            trap 'rm -f "$INTERNAL_HEALTH_BODY"' EXIT

            INTERNAL_HTTP_STATUS=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              -o "$INTERNAL_HEALTH_BODY" -w '%{http_code}' \
              "http://127.0.0.1:8000/health")

            if [ "$INTERNAL_HTTP_STATUS" != "200" ]; then
              echo "❌ Internal API returned HTTP ${INTERNAL_HTTP_STATUS}"
              exit 1
            fi

            $COMPOSE exec -T altegio-api /app/.venv/bin/python -c '
            import json
            import sys

            try:
                data = json.load(sys.stdin)
            except Exception:
                print("FAIL: response body is not valid JSON")
                sys.exit(1)

            if not isinstance(data, dict) or data.get("ok") is not True:
                print("FAIL: unexpected response body")
                sys.exit(1)

            print("OK: internal API healthy")
            ' < "$INTERNAL_HEALTH_BODY"

            echo "✅ Internal API is healthy"

      - name: Verify public HTTPS health endpoint
        env:
          PUBLIC_HEALTH_URL: https://api.kitilash.com/health
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=5
          RETRY_DELAY_SECONDS=5
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT

          attempt=1
          status="000"
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            status=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              -o "$BODY_FILE" -w '%{http_code}' \
              "$PUBLIC_HEALTH_URL" || echo "000")

            if [ "$status" = "200" ]; then
              break
            fi

            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: public health endpoint returned status '${status}'"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$MAX_ATTEMPTS" ]; then
              sleep "$RETRY_DELAY_SECONDS"
            fi
          done

          if [ "$status" != "200" ]; then
            echo "❌ Public HTTPS health endpoint did not return 200 after ${MAX_ATTEMPTS} attempts"
            exit 1
          fi

          python3 - "$BODY_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as fh:
              try:
                  data = json.load(fh)
              except Exception:
                  print("FAIL: response body is not valid JSON")
                  raise SystemExit(1)

          if not isinstance(data, dict) or data.get("ok") is not True:
              print("FAIL: unexpected response body")
              raise SystemExit(1)

          print("OK: public health endpoint healthy")
          PY

          echo "✅ Public HTTPS health endpoint is healthy"

      - name: Notify via Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}

          message: |
            🤖 *AltegioBot Deploy + post-deploy verification*

            *Repository:* `${{ github.repository }}`
            *Branch:* `${{ github.ref_name }}`
            *Commit:* `${{ github.sha }}`
            *Status:* `${{ job.status }}`

            *Run details:*
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
