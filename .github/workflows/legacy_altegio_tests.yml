# The quarantined half of the suite: modules explicitly marked
# `legacy_altegio`, covering Altegio-only functionality that the required PR
# gate in ci_deploy.yml no longer runs. They are NOT deleted, skipped or
# xfailed — they run here, every night and on demand.
#
# This workflow deliberately has no `push`, `pull_request` or `workflow_run`
# trigger, and no deploy step of any kind. `workflow_dispatch` on ci_deploy.yml
# against main starts a production deploy, which is exactly why a schedule was
# not bolted onto that file instead.
#
# A red nightly run is triaged, not muted. See docs/ops/test_suite_tiers.md.
name: Legacy Altegio Tests

on:
  schedule:
    # 02:23 UTC — off-peak, and off the top of the hour where scheduled runs
    # pile up and get delayed.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-tests:
    name: Run Legacy Altegio Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altegio_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d altegio_bot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      # Throwaway local service credentials for the ephemeral runner database.
      # No production secret is read by this workflow.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/altegio_bot_test
      ALTEGIO_WEBHOOK_SECRET: test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and deps
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: Wait for Postgres
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          import asyncpg

          def to_asyncpg_dsn(sqlalchemy_dsn: str) -> str:
              dsn = sqlalchemy_dsn.strip().strip('"').strip("'")
              if dsn.startswith('postgresql+asyncpg://'):
                  return 'postgresql://' + dsn.split('://', 1)[1]
              return dsn

          async def main() -> None:
              raw = os.environ['DATABASE_URL']
              dsn = to_asyncpg_dsn(raw)
              for _ in range(120):
                  try:
                      conn = await asyncpg.connect(dsn, timeout=3)
                      await conn.close()
                      print('Postgres is ready')
                      return
                  except:
                      await asyncio.sleep(1)
              raise SystemExit('Postgres did not become ready')
          asyncio.run(main())
          PY

      # Positive marker selection, no continue-on-error: this run is allowed to
      # go red, and a red run is a real finding about Altegio behaviour.
      - name: Run legacy Altegio suite
        run: uv run pytest -q -ra -m legacy_altegio --durations=50
