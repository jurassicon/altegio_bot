services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-altegio_bot}
      POSTGRES_USER: ${POSTGRES_USER:-altegio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-altegio} -d ${POSTGRES_DB:-altegio_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  altegio-api:
    build: .
    restart: always
    env_file:
      - .env
      # Секреты EasyWeek. required: false обязателен — без него отсутствие файла
      # на сервере уронит деплой всего сервиса.
      - path: easyweek.env
        required: false
    ports:
      # Порт слушает только loopback: наружу API ходит через host-level reverse
      # proxy, а публичный bind позволял бы обойти его (и его TLS/лимиты) по
      # адресу сервера. Если proxy живёт НЕ на этом хосте и не в сети compose —
      # выставьте API_BIND_HOST=0.0.0.0, иначе он получит connection refused.
      - "${API_BIND_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # --no-access-log: см. Dockerfile — query string с секретом не должна
    # попадать в access-лог. Путь/статус/время логирует AccessLogMiddleware.
    command:
      ["/app/.venv/bin/uvicorn", "altegio_bot.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  altegio-inbox-worker:
    build: .
    restart: always
    env_file: .env
    # SIGTERM asks the worker to stop claiming new batches and to finish the one
    # it already moved `received -> processing`. The deploy drains this worker
    # before swapping the provider-scoped unique constraints, so Docker must
    # wait for that drain instead of killing it and stranding rows in
    # `processing`. Generous on purpose: a full batch of slow events is rare but
    # must not be truncated.
    stop_grace_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_inbox_worker"]

  # The one shared worker that also renders EasyWeek lifecycle jobs, so it is the
  # one shared worker that needs easyweek.env: `EASYWEEK_LOCATION_MAP` and
  # `EASYWEEK_DEFAULT_LANGUAGE` are read here. required:false keeps an
  # Altegio-only host deployable without the file.
  #
  # NOTE: `docker compose restart` does NOT re-read env_file — changing the
  # EasyWeek booking URL or language requires
  # `up -d --force-recreate altegio-outbox-worker`.
  #
  # PR-8: this service reads EASYWEEK_REMINDER_API_GUARD_ENABLED (the send
  # fence) and, because every reminder is verified against the live API before
  # it is sent, EASYWEEK_API_KEY / EASYWEEK_WORKSPACE_SLUG.
  #
  # PR-9 adds EASYWEEK_REVIEW_SEND_ENABLED here — the review send fence. It is
  # already in easyweek.env, which this service already loads: no new service,
  # no new secret, and no EasyWeek API call on the review send path. Review
  # PLANNING is a different flag on a different service; see
  # altegio-easyweek-inbox-worker below.
  #
  # PR-12 adds EASYWEEK_RETENTION_SEND_ENABLED here — the retention send fence
  # for repeat_10d and comeback_3d — and EASYWEEK_RETENTION_CANARY_JOB_ID, the
  # controlled-canary restriction that limits sending to one named job id. Same
  # file, no new service and no new secret. Retention PLANNING is
  # EASYWEEK_RETENTION_ENABLED on the inbox worker below.
  #
  # EASYWEEK_NOTIFICATIONS_ENABLED gates retention SENDING here too, not only
  # planning: a queued retention job is still a customer message, so the master
  # fence has to be able to stop one that is already in the queue.
  #
  # This service is also the base image for the one-off review preflight
  # (`run --rm --no-deps --entrypoint /app/.venv/bin/python
  # altegio-outbox-worker -m altegio_bot.scripts.easyweek_review_preflight`),
  # and for the PR-12 one the same way
  # (`... -m altegio_bot.scripts.easyweek_retention_preflight`).
  # That process reads EASYWEEK_REVIEWS_ENABLED too — the running worker never
  # does. A one-off container is required rather than `exec`, because this
  # long-running container keeps the environment it was created with, and the
  # rollout enables planning while deliberately leaving it untouched.
  altegio-outbox-worker:
    build: .
    restart: always
    env_file:
      - .env
      - path: easyweek.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_outbox_worker"]

  altegio-whatsapp-inbox-worker:
    build: .
    restart: always
    env_file: .env
    # SIGTERM stops this worker from claiming a NEW batch, but a batch already
    # committed as `processing` must be drained: nothing recovers ordinary
    # inbound messages or Meta status callbacks left in that state. The default
    # 10s SIGKILL would strand them, so allow a full batch to finish.
    stop_grace_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_whatsapp_inbox_worker"]

  altegio-meta-guard-worker:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_meta_guard_worker"]

  altegio-campaign-worker:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_campaign_worker"]

  altegio-followup-worker:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_followup_worker"]

  # EasyWeek normalizer (PR-4). Separate service on purpose: the live Altegio
  # inbox worker is not touched by this rollout.
  #
  # Reads easyweek.env in addition to .env, with required:false so a host
  # without the file still deploys. The worker stays inert and quiet until
  # EASYWEEK_PROCESSING_ENABLED=true AND EASYWEEK_LOCATION_MAP is valid, so
  # deploying PR-4 does not start chewing through the captured backlog.
  #
  # NOTE: `docker compose restart` does NOT re-read env_file — flipping any
  # EASYWEEK_* flag requires `up -d --force-recreate altegio-easyweek-inbox-worker`.
  #
  # PR-8: this service reads EASYWEEK_REMINDERS_ENABLED (reminder PLANNING).
  # The send fence, EASYWEEK_REMINDER_API_GUARD_ENABLED, is read by
  # altegio-outbox-worker instead — recreate that one when flipping it.
  #
  # PR-9: likewise EASYWEEK_REVIEWS_ENABLED (review PLANNING) is read here;
  # its send fence EASYWEEK_REVIEW_SEND_ENABLED belongs to the outbox worker.
  # PR-10: EASYWEEK_GOOGLE_REVIEW_LINKS is read here (review planning) and by
  # altegio-outbox-worker (send-time re-proof). `docker compose restart` does
  # NOT re-read env_file — recreate both services after changing it.
  #
  # PR-12: EASYWEEK_RETENTION_ENABLED (repeat_10d / comeback_3d PLANNING) is read
  # here; its send fence EASYWEEK_RETENTION_SEND_ENABLED belongs to the outbox
  # worker. Planning also needs the PR-11 counter below: a repeat with no proven
  # baseline is never created.
  #
  # PR-11: EASYWEEK_VISIT_COUNTER_ENABLED is read HERE and nowhere else. The
  # visit counter has no send fence because it sends nothing — it stores the
  # `visits_total` snapshot a proven booking-succeeded carries. Recreate ONLY
  # this service when flipping it; adding it to the outbox worker would imply a
  # second reader that does not exist.
  altegio-easyweek-inbox-worker:
    build: .
    restart: always
    env_file:
      - .env
      - path: easyweek.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.run_easyweek_inbox_worker"]

  # Migration runner — not started by default `docker compose up -d`.
  # Run explicitly: docker compose --profile ops run --rm migrate
  migrate:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles:
      - ops

  # One-shot retirement of a pre-graceful altegio-whatsapp-inbox-worker (PR-7.1).
  # Not started by `docker compose up -d`; run explicitly, always with --build so
  # the helper is the code of the commit being deployed:
  #   docker compose --profile ops run --rm --build easyweek-legacy-retire \
  #     -m altegio_bot.scripts.retire_legacy_whatsapp_worker --probe
  #
  # This is the ONLY service that mounts the host Docker socket. It exists
  # because the retirement must pause and remove the legacy container while
  # holding a PostgreSQL barrier open, and it is ephemeral: no long-running
  # service ever gets a Docker client or that socket.
  easyweek-legacy-retire:
    build:
      context: .
      dockerfile: Dockerfile.ops
    env_file:
      - .env
      - path: easyweek.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
    profiles:
      - ops

  # PR-11.1 one-off cutover runner. NOT started by `docker compose up -d`.
  #
  # It exists because the migration CLI needs two things no long-running service
  # has: an operator-supplied manifest and EasyWeek customer export on the way
  # in, and a report that survives the container on the way out. Running it in
  # `altegio-easyweek-inbox-worker` looked right and was not — that container has
  # no mounts, so every documented path pointed at a directory that did not exist
  # inside it, and any report it wrote died with the container.
  #
  # Inputs are mounted READ-ONLY. The customer export is PII; the container has
  # no reason to be able to modify or grow it, and a read-only mount is the
  # cheapest way to guarantee it does not.
  #
  # Host paths are configurable so no operator's directory layout is baked in:
  #   EASYWEEK_MIGRATION_INPUT_DIR   (default ./outputs/easyweek_migration/input)
  #   EASYWEEK_MIGRATION_REPORT_DIR  (default ./outputs/easyweek_migration)
  # Both live under `outputs/`, which is git-ignored.
  #
  # Run explicitly, always with --build so the tool is the code of the commit
  # being deployed:
  #   docker compose --profile ops run --rm --build easyweek-booking-migration \
  #     dry-run --manifest /migration/input/manifest.json \
  #     --customer-directory /migration/input/customers.csv \
  #     --cutover-at 2026-09-01T00:00:00+02:00
  easyweek-booking-migration:
    build: .
    env_file:
      - .env
      - path: easyweek.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${EASYWEEK_MIGRATION_INPUT_DIR:-./outputs/easyweek_migration/input}:/migration/input:ro
      - ${EASYWEEK_MIGRATION_REPORT_DIR:-./outputs/easyweek_migration}:/migration/reports
    environment:
      # Where the CLI writes its report INSIDE the container. It is the mounted
      # directory, so the report lands on the host and outlives the run.
      EASYWEEK_MIGRATION_REPORT_DIR: /migration/reports
    entrypoint:
      ["/app/.venv/bin/python", "-m", "altegio_bot.scripts.easyweek_migration"]
    command: ["--help"]
    working_dir: /app
    restart: "no"
    profiles:
      - ops

volumes:
  postgres_data:
  redis_data:
